<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bachelor Trail</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#151d17;color:#e9e8d8;font:16px/1.5 system-ui}main{max-width:750px;margin:auto;padding:16px}header,.panel{background:#273629;border:1px solid #6d784e;border-radius:13px;padding:19px;margin:12px 0}header{text-align:center}h1,h2{font-family:Georgia,serif;color:#f3d58b}h1{font-size:clamp(28px,7vw,45px);margin:5px}h2{margin:5px 0}.small{color:#c4cbb8;font-size:13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}@media(min-width:600px){.stats{grid-template-columns:repeat(3,1fr)}}.stat{background:#334536;padding:12px;border-radius:9px}.stat b{display:block;font-size:21px;color:#f3d58b}.meter{height:7px;background:#141e16;border-radius:9px;overflow:hidden}.meter div{height:100%;background:#93b981}button{width:100%;background:#40573c;border:1px solid #a7b493;color:#fff;border-radius:9px;padding:13px;margin:5px 0;font:inherit;text-align:left;cursor:pointer}button:hover,button:focus{background:#5a774e}.primary{text-align:center;background:#6d8748;font-weight:700}.log{max-height:200px;overflow:auto;font-size:13px}.log p{border-bottom:1px solid #465548;padding-bottom:5px}footer{text-align:center;color:#aeb6a8;font-size:12px}
</style></head><body><main><header><div class="small">MID-LIFE SOFTWARE • 2026</div><h1>THE OREGON TRAIL</h1><div>The $130K+ Bachelor Edition</div><div style="font-size:42px">🚙 🛣️ 🍺</div><div class="small">Survive fifteen years of questionable decisions.</div></header><div id="stats" class="stats"></div><section class="panel" id="screen"></section><section class="panel" id="journal" style="display:none"><h2>Trail Journal</h2><div id="log" class="log"></div></section><footer>Satirical fiction. Liver Integrity is an arcade score, not a medical measurement. Saves are local to this browser.</footer></main>
<script>
const scenes=[
["Saturday Brunch","Your friends propose bottomless mimosas. Your fitness tracker is pleading for mercy.",[["Three hours of brunch",[-180,-6,-10,-3,13],"The Uber driver knows your secrets."],["Eggs, coffee and a walk",[-32,8,3,5,3],"Your watch congratulates you."],["Buy an espresso machine",[-2400,1,0,-2,10],"Your coffee now costs $19 a cup."]]],
["Dating App Crossing","Your match is 'fluent in sarcasm' and wants someone 'emotionally available.'",[["Expensive steakhouse",[-420,-1,-2,2,12],"The check was more memorable than the date."],["Coffee and a museum",[-45,4,2,8,8],"A surprisingly good conversation."],["Delete the app, see live music",[-170,2,2,5,12],"The guitarist is also divorced."]]],
["The IPA Ford","Your buddies are watching the game. The beer menu has its own table of contents.",[["Six strong IPAs",[-110,-10,-15,-5,12],"Monday morning is cancelled."],["Dinner and one beer",[-48,-1,-2,4,7],"You remember the final score."],["Cook at home and call a friend",[-25,6,4,7,5],"Your friend actually picks up."]]],
["The Luxury Wagon","Your paid-off car works perfectly. The dealership says you deserve more.",[["Buy the luxury SUV",[-21000,0,0,-6,18],"The cupholders are heated. The depreciation is not."],["Keep and detail your car",[-240,2,1,8,4],"You find a fossilized French fry."],["Buy a used sports car",[-12500,-1,0,-3,20],"You have purchased a second personality."]]],
["Annual Physical","Your physician requests follow-up bloodwork and a conversation about drinking.",[["Attend and follow the care plan",[-250,12,7,9,2],"Taking action is less frightening than the portal message."],["Ignore the portal",[0,-12,-9,-8,2],"The notification badge becomes permanent."],["Buy wellness gadgets instead",[-800,-3,-5,-3,7],"Your smart ring cannot negotiate with your liver."]]],
["The Homeowner's Trail","The air conditioning breaks on the hottest day of the year.",[["Get a second estimate",[-3200,2,0,8,1],"The second contractor finds a smaller problem."],["Replace everything",[-14000,0,0,-3,3],"The thermostat needs a firmware update."],["Pretend it's camping",[-80,-8,0,-5,5],"The dog considers moving out."]]],
["The Ex Texts at 1:47 A.M.","The message reads: 'Hey stranger.'",[["Write seven paragraphs",[0,-2,0,-18,-4],"The typing bubbles vanish."],["Wait until morning",[0,2,0,10,3],"A historic act of impulse control."],["Put the phone down and sleep",[0,8,2,12,2],"Nothing happens. A triumph."]]],
["Market Correction","Your retirement account drops 18%. A podcast host predicts the apocalypse.",[["Panic sell",[-32000,-6,0,-12,-5],"The podcast host sells you a course."],["Review your plan",[-4000,4,0,12,1],"Your advisor says 'reasonable.'"],["Stop checking every six minutes",[-5500,8,0,7,4],"Your screen time falls dramatically."]]],
["Bourbon Detour","A friend discovers a bottle that costs more than a flight to Chicago.",[["All-night tasting",[-440,-9,-18,-5,14],"Tasting notes: brown, expensive, regrettable."],["Taste a little, eat dinner",[-95,0,-3,5,7],"You can still identify your front door."],["Zero-proof option",[-35,5,5,7,5],"Ginger and lime are surprisingly convincing."]]],
["Vacation Crossing","Your buddy proposes a week in Iceland.",[["Business class and fancy hotels",[-9400,2,0,1,20],"The waterfalls are magnificent."],["Economy, spend on experiences",[-3800,6,0,5,17],"Your knees survive the flight."],["Stay home and renovate garage",[-2900,1,0,3,4],"You now own twelve screwdrivers."]]],
["Midnight Delivery","The fridge contains mustard, beer, and shredded cheese.",[["Order delivery",[-86,-5,0,-2,4],"The fries are cold."],["Buy groceries and meal prep",[-100,7,2,7,3],"You purchase actual vegetables."],["Go out for drinks and nachos",[-125,-8,-11,-4,9],"You meet three people you hoped never to see again."]]],
["Financial Advisor","Your advisor notices a five-figure charge at a guitar store.",[["Vintage guitars are investments",[-6000,0,0,-7,14],"The advisor sighs into a notebook."],["Return the guitar",[4500,3,0,11,-2],"Your future self thanks you."],["Keep it, cancel subscriptions",[-300,1,0,6,9],"You still can't play the solo."]]]
];
const surprises=[["Surprise bonus",[12000,0,0,0,4]],["The roof leaks",[-6500,-2,0,-4,0]],["Routine checkup pays off",[-180,4,4,3,0]],["An expensive weekend",[-1700,-2,-2,0,8]],["An old friend visits",[-80,3,1,5,10]],["You injure yourself sleeping",[0,-6,0,-2,-3]]];
let s;const key="bachelorTrail-v2";const clamp=x=>Math.max(0,Math.min(100,x));const usd=x=>"$"+Math.round(x).toLocaleString();
function newGame(){s={age:50,year:2026,turn:0,cash:180000,health:75,liver:78,dignity:65,fun:48,deck:[...Array(scenes.length).keys()].sort(()=>Math.random()-.5),history:[],done:false};save();render()}
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
function apply(d){s.cash=Math.max(0,s.cash+d[0]);["health","liver","dignity","fun"].forEach((k,i)=>s[k]=clamp(s[k]+d[i+1]))}
function pick(i){const e=scenes[s.deck[s.turn%scenes.length]],c=e[2][i];apply(c[1]);s.history.unshift("Age "+s.age+": "+e[0]+" — "+c[2]);s.turn++;s.age++;s.year++;if(s.turn%3===0&&s.turn<15){const r=surprises[Math.floor(Math.random()*surprises.length)];apply(r[1]);s.history.unshift("RANDOM EVENT: "+r[0])}if(s.turn>=15||s.health<=0||s.liver<=0||s.cash<=0)s.done=true;save();render()}
function reset(){if(confirm("Restart your trail and replace the current save?"))newGame()}
function render(){const screen=document.getElementById("screen"),stats=document.getElementById("stats"),journal=document.getElementById("journal");if(!s){stats.innerHTML="";journal.style.display="none";screen.innerHTML='<h2>Choose your profession: Affluent Bachelor</h2><p>You are 50, single, earning $165,000 annually, and your doctor keeps saying "at your age." Reach retirement with your money, dignity, and liver intact.</p><button class="primary" id="start">Begin the Trail →</button>';document.getElementById("start").onclick=newGame;return}
stats.innerHTML=[["Age",s.age],["Cash",usd(s.cash)],["Health",s.health],["Liver Integrity",s.liver],["Dignity",s.dignity],["Good Times",s.fun]].map(([k,v])=>'<div class="stat"><small>'+k+'</small><b>'+v+(typeof v==="number"&&k!=="Age"?"%":"")+'</b>'+(["Health","Liver Integrity","Dignity","Good Times"].includes(k)?'<div class="meter"><div style="width:'+v+'%;background:'+(v<30?"#dd8169":"#93b981")+'"></div></div>':"")+'</div>').join("");
journal.style.display="block";document.getElementById("log").innerHTML=s.history.slice(0,30).map(x=>"<p>"+x+"</p>").join("")||"<p>No disasters yet.</p>";
if(s.done){let ending=s.liver<=0?"YOU HAVE DIED OF LIVER FAILURE":s.health<=0?"YOU HAVE DIED OF LIFESTYLE CHOICES":s.cash<=0?"YOU HAVE DIED OF FINANCIAL OVERCONFIDENCE":s.health>=65&&s.liver>=60?"YOU MADE IT TO RETIREMENT!":"YOU SURVIVED THE TRAIL";screen.innerHTML="<h2>"+ending+"</h2><p>Final score: "+Math.round(s.cash/1000+s.health*3+s.liver*3+s.dignity*2+s.fun)+"</p><p>Your bartender has stories. Your accountant has spreadsheets.</p><button class='primary' id='restart'>Try Another Life ↻</button>";document.getElementById("restart").onclick=reset;return}
let e=scenes[s.deck[s.turn%scenes.length]];screen.innerHTML='<div class="small">YEAR '+s.year+' · STOP '+(s.turn+1)+' OF 15</div><h2>'+e[0]+'</h2><p>'+e[1]+'</p><div id="choices"></div><button id="restart" style="text-align:center;background:transparent">Restart Game</button>';e[2].forEach((c,i)=>{let b=document.createElement("button");b.textContent=String.fromCharCode(65+i)+". "+c[0];b.onclick=()=>pick(i);document.getElementById("choices").appendChild(b)});document.getElementById("restart").onclick=reset}
try{s=JSON.parse(localStorage.getItem(key));if(!s||!Array.isArray(s.deck))s=null}catch(e){s=null}render();
</script></body></html>
